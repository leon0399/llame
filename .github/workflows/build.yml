name: Build

# The build stage of CI (ci.yml): compile every workspace and prove the
# checked-in API schema and web client are regenerated.
#
# Actions are pinned to commit SHAs (comment = the release tag they resolve to).

on:
  workflow_call:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: build

      - run: pnpm exec turbo run build --concurrency=1

      # Regenerate the API schema and portable web client in dependency order;
      # a drifted checked-in copy is a failure, not a silent fixup.
      - run: pnpm generate:api-schema
      - run: pnpm generate:web-client
      - run: git diff --exit-code
