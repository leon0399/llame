# The test pyramid, as a graph of stages (docs/development/testing.md is the
# contract). Each stage is its own reusable workflow; this file only orders
# them and owns the triggers.
#
#   typecheck
#   test      (test.yml: one leg per workspace; api in shards + merge)
#   mutation  (mutation.yml: API in shards + gate; small workspaces)
#   build     (build.yml) -> e2e  (e2e.yml: Playwright)
#                         -> dast (dast.yml: Schemathesis legs, ZAP)
#
# Every stage starts at once except the two that boot the compiled stack:
# Product e2e and API DAST wait for Build, so a broken build or a drifted
# generated client never spends runners on a full-stack suite. Nothing else
# waits for a cheaper gate: on these runners a red cheap gate costs only the
# runners the parallel stages used, while waiting costs every green run the
# gate's whole duration.
#
# The nightly schedule runs only typecheck, build and API DAST, with a fresh
# Schemathesis seed and a longer budget, so unchanged code still gets new
# fuzzing inputs.
#
# Static checks (lint, format, workflow linting) live in lint.yml — they need
# no build, browser or database, and report independently.
#
# Actions are pinned to commit SHAs (comment = the release tag they resolve to).

name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A new push supersedes the old run on a pull request: nothing there needs to
# finish for a commit that is already outdated. Each master run gets its own
# group, because a shared group would still replace a pending master run when
# the next merge lands; every merged commit therefore gets a complete verdict
# even when stack layers land back to back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: typecheck

      # Full-program check on tsgo (TypeScript 7 Go port) — covers tests, which
      # `nest build` and Next's bundled check exclude. Emit stays on TS 5.x.
      - run: pnpm exec turbo run typecheck

  test:
    name: Tests
    # Nightly and on-demand runs exist for API DAST only.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      # OIDC for the Codecov coverage and Test Analytics uploads.
      id-token: write

  build:
    name: Build
    uses: ./.github/workflows/build.yml

  mutation:
    name: Mutation testing
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    uses: ./.github/workflows/mutation.yml

  e2e:
    name: Product e2e
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    needs: [build]
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      # OIDC for the Test Analytics upload.
      id-token: write

  # Always called after build: a pull request that does not change the API
  # reports the scanner jobs as skipped, which satisfies a required check,
  # where a skipped caller would leave them pending.
  dast:
    name: API DAST
    needs: [build]
    uses: ./.github/workflows/dast.yml
    permissions:
      contents: read
      security-events: write
      # OIDC for the Schemathesis Test Analytics upload.
      id-token: write
    with:
      scan: ${{ needs.build.outputs.dast == 'true' }}
