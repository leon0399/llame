# The test pyramid, as a set of stages (docs/development/testing.md is the
# contract). Each stage is its own reusable workflow; this file only lists
# them and owns the triggers.
#
#   typecheck
#   test      (test.yml: one leg per workspace; api in shards + merge)
#   mutation  (mutation.yml: API in shards + gate; small workspaces)
#   build     (build.yml: every workspace + generated-diff check)
#   e2e       (e2e.yml: Playwright; builds the web app itself)
#   dast      (dast.yml: builds the API, then Schemathesis legs and ZAP)
#
# Product stages start together after the lightweight change-scope job admits
# them. No product stage waits on another product stage.
#
# The nightly schedule runs only typecheck, build and API DAST, with a fresh
# Schemathesis seed and a longer budget, so unchanged code still gets new
# fuzzing inputs.
#
# Static checks (lint, format, workflow linting) live in lint.yml — they need
# no build, browser or database, and report independently.
#
# Actions are pinned to commit SHAs (comment = the release tag they resolve to).

name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A new push supersedes the old run on a pull request: nothing there needs to
# finish for a commit that is already outdated. Each master run gets its own
# group, because a shared group would still replace a pending master run when
# the next merge lands; every merged commit therefore gets a complete verdict
# even when stack layers land back to back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: Product change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: node-version
        run: echo "version=$(tr -d '[:space:]' < .node-version)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false
          runtime: node@${{ steps.node-version.outputs.version }}

      - id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          elif [ "$EVENT" = push ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          else
            echo "product=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          scope=$(git diff --name-only --no-renames -z "$base" HEAD |
            node scripts/ci-product-scope.mjs)
          case "$scope" in
            product=true|product=false) echo "$scope" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::Invalid product scope output"; exit 1 ;;
          esac

  typecheck:
    name: Typecheck
    needs: [changes]
    if: ${{ needs.changes.outputs.product == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: typecheck

      # Full-program check on tsgo (TypeScript 7 Go port) — covers tests, which
      # `nest build` and Next's bundled check exclude. Emit stays on TS 5.x.
      - run: pnpm exec turbo run typecheck

  test:
    name: Tests
    needs: [changes]
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    uses: ./.github/workflows/test.yml
    with:
      product: ${{ needs.changes.outputs.product == 'true' }}
    permissions:
      contents: read
      # OIDC for the Codecov coverage and Test Analytics uploads.
      id-token: write

  build:
    name: Build
    needs: [changes]
    uses: ./.github/workflows/build.yml
    with:
      product: ${{ needs.changes.outputs.product == 'true' }}

  mutation:
    name: Mutation testing
    needs: [changes]
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    uses: ./.github/workflows/mutation.yml
    with:
      product: ${{ needs.changes.outputs.product == 'true' }}

  e2e:
    name: Product e2e
    needs: [changes]
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    uses: ./.github/workflows/e2e.yml
    with:
      product: ${{ needs.changes.outputs.product == 'true' }}
    permissions:
      contents: read
      # OIDC for the Test Analytics upload.
      id-token: write

  # DAST retains its narrower API scope for product-relevant pull requests.
  dast:
    name: API DAST
    needs: [changes]
    if: ${{ needs.changes.outputs.product == 'true' }}
    uses: ./.github/workflows/dast.yml
    permissions:
      contents: read
      security-events: write
      # OIDC for the Schemathesis Test Analytics upload.
      id-token: write
