# The test pyramid, as a job graph (docs/testing.md is the contract).
#
#   typecheck -> test (one leg per workspace, coverage) --+
#   typecheck -> build -----------------------------------+-> browser-e2e
#   typecheck -> mutation
#
# One job per concern, so a red X names what broke instead of hiding inside a
# grab-bag. Cheap gates run first and unconditionally; each expensive layer
# waits for the cheaper layer that would have caught the same breakage — a
# type error never spends a runner on the full-stack browser suite, and the
# browser suite never boots a stack whose api contract is already failing.
# Build and mutation wait only for typecheck: no test leg catches a build
# failure, and Stryker's own initial run fails on a red suite.
#
# Static checks (lint, format, workflow linting) live in lint.yml — they need
# no build, browser or database, and report independently.
#
# Actions are pinned to commit SHAs (comment = the release tag they resolve to).

name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push supersedes the old run: nothing here needs to finish for a commit
# that is already outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: typecheck

      # Full-program check on tsgo (TypeScript 7 Go port) — covers tests, which
      # `nest build` and Next's bundled check exclude. Emit stays on TS 5.x.
      - run: pnpm exec turbo run typecheck

  # Every test suite runs once, with coverage: each leg runs one workspace's
  # `test:coverage`, which enforces its Vitest thresholds (and CRAP where the
  # script adds it), then uploads that report to Codecov as the leg's flag.
  # Adding a leg means adding its flag to .github/codecov.yml and raising
  # after_n_builds there.
  test:
    name: Tests (${{ matrix.flag }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [typecheck]
    permissions:
      contents: read
      # OIDC replaces a CODECOV_TOKEN secret; fork pull requests fall back to
      # Codecov's tokenless upload inside the action.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Self-provisioning (Testcontainers in the project's globalSetup): a
          # throwaway Postgres owned by a NON-superuser role that runs the
          # migrations — the worst-case single-role self-hosted deployment, so
          # a green RLS suite proves FORCE constrains even the table owner.
          # Needs host Docker, hence no container image for this leg.
          - flag: api
            dir: apps/api
          # One Vitest run over node/jsdom tests plus stories in Chromium, so
          # a single report spans the workspace.
          - flag: web
            dir: apps/web
            browser: true
          - flag: ui
            dir: packages/ui
            browser: true
          - flag: storybook
            dir: apps/storybook
          - flag: bash-executor
            dir: packages/bash-executor
          - flag: config-interpolation
            dir: packages/config-interpolation
          - flag: native-file-tools
            dir: packages/native-file-tools
          - flag: oxlint-plugin-anti-slop
            dir: packages/oxlint-plugin-anti-slop
          - flag: runtime-safety
            dir: packages/runtime-safety
          # Root tooling scripts: node:test with Node's own coverage (lcov).
          - flag: scripts
            dir: .
            filter: //
            task: test:scripts:coverage
            report: lcov.info
    # Browser legs run in the Playwright image, which ships Chromium and its
    # system libraries, so they skip `playwright install --with-deps`. An
    # empty image runs the leg on the host, where the api leg's Docker is.
    container:
      # Pinned by digest, like every action here: a retag would otherwise
      # change the browser and base image for an already-reviewed commit.
      # Refresh with the catalog's playwright version:
      #   docker buildx imagetools inspect mcr.microsoft.com/playwright:vX.Y.Z-noble
      image: ${{ matrix.browser && 'mcr.microsoft.com/playwright:v1.55.1-noble@sha256:2f29369043d81d6d69a815ceb80760f55e85f5020371ad06a4d996f18503ad1c' || '' }}
      # Chromium renderers allocate from /dev/shm, and Docker's default 64 MB
      # segment is a known crash source under parallel story runs; --ipc=host
      # is Playwright's documented mitigation for Chromium in containers.
      options: --ipc=host
    env:
      # The image ships its browsers at /ms-playwright, but the step's HOME is
      # /github/home, so Playwright would look in ~/.cache and find nothing.
      # Host legs launch no browser.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Same locale pinning as the browser-e2e job: Node >=21 derives
      # navigator.language from the process locale, and an invalid tag makes
      # `new Intl.Locale(...)` throw during SSR.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # No turbo-cache: test tasks are `cache: false` (turbo.json), so a cache
      # here would be written and never read.
      - uses: ./.github/actions/setup

      # Through turbo, not pnpm directly: some packages' test:coverage
      # depends on ^build, since their workspace imports resolve to dist/.
      - env:
          TEST_FILTER: ${{ matrix.filter || format('./{0}', matrix.dir) }}
          TEST_TASK: ${{ matrix.task || 'test:coverage' }}
        run: pnpm exec turbo run "$TEST_TASK" --filter="$TEST_FILTER"

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          flags: ${{ matrix.flag }}
          files: ${{ matrix.dir }}/coverage/${{ matrix.report || 'coverage-final.json' }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: build

      - run: pnpm exec turbo run build --concurrency=1

      # Regenerate the API schema and portable web client in dependency order;
      # a drifted checked-in copy is a failure, not a silent fixup.
      - run: pnpm generate:api-schema
      - run: pnpm generate:web-client
      - run: git diff --exit-code

  # Mutate the lines this diff changed and require them to be detected. No
  # stored index, no baseline restore, no environment fingerprint: the scope is
  # computed from the diff against the pull request's own tree, so it cannot go
  # stale and cannot refuse for want of a prior measurement. `coverageAnalysis:
  # perTest` runs only the tests covering each mutant. See
  # docs/mutation-gate-redesign.md.
  mutation:
    name: Mutation testing (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [typecheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            workspace: apps/api
          - name: config-interpolation
            workspace: packages/config-interpolation
          - name: runtime-safety
            workspace: packages/runtime-safety
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - env:
          MUTATION_WORKSPACE: ${{ matrix.workspace }}
          # A pull request measures against its base. A trusted push measures
          # against the commit it advanced from, so a merge is scored on the
          # lines it introduced rather than re-scoring master.
          MUTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/mutation-changed-lines.mjs run \
            --workspace "$MUTATION_WORKSPACE" --base "$MUTATION_BASE"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-${{ matrix.name }}
          path: ${{ matrix.workspace }}/reports/mutation/
          retention-days: 14
          if-no-files-found: ignore

  browser-e2e:
    name: Product e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The top of the pyramid: everything below it has already passed, so a
    # failure here is a genuine cross-stack defect rather than a unit-level
    # bug wearing a browser costume. The generic build and every test leg,
    # including real-Postgres integration, must pass first. Playwright then
    # rebuilds the web app with its E2E API URL.
    needs: [build, test]
    env:
      # Node >=21 derives navigator.language from the process locale; with
      # LANG=C/unset it reports an invalid tag and `new Intl.Locale(...)`
      # throws during SSR (seen via TanStack Query devtools under Next).
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Host runner (not the Playwright image): this suite boots a throwaway
      # Postgres through the Docker CLI, which a container job cannot reach.
      - run: pnpm exec playwright install --with-deps chromium

      # Boots db + api + worker + the mock model server, builds and starts the
      # production web app, then drives Chromium against the real stack. The
      # ONLY place the browser suite runs — keep it green.
      - run: pnpm test:e2e

      # failure() || cancelled(), NOT !cancelled(): a timed-out or cancelled
      # run is exactly when the trace is worth keeping. Playwright's CI config
      # fails on flaky retries too, so their first-attempt evidence reaches
      # this upload instead of being discarded behind an eventual exit 0.
      - if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
