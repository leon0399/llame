# The test pyramid, as a job graph (docs/testing.md is the contract).
#
#   typecheck ------> API unit + integration ----+
#   typecheck + unit -> build --------------------+-> browser-e2e
#   typecheck + unit -> component (Storybook)
#   typecheck + unit + mutation-plan -> mutation
#
# One job per concern, so a red X names what broke instead of hiding inside a
# grab-bag. Cheap gates run first and unconditionally; each expensive layer
# waits for the cheaper layer that would have caught the same breakage — a
# type error never spends a runner on the full-stack browser suite, and the
# browser suite never boots a stack whose api contract is already failing.
#
# Static checks (lint, format, workflow linting) live in lint.yml — they need
# no build, browser or database, and report independently.
#
# Actions are pinned to commit SHAs (comment = the release tag they resolve to).

name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push supersedes the old run: nothing here needs to finish for a commit
# that is already outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  mutation-plan:
    name: Mutation scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      api_mode: ${{ steps.scope.outputs.api_mode }}
      api_count: ${{ steps.scope.outputs.api_count }}
      api_matrix: ${{ steps.scope.outputs.api_matrix }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - id: scope
        env:
          MUTATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$MUTATION_BASE" ]]; then
            node scripts/mutation-sharding.mjs plan --base "$MUTATION_BASE"
          else
            node scripts/mutation-sharding.mjs plan
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: typecheck

      # Full-program check on tsgo (TypeScript 7 Go port) — covers tests, which
      # `nest build` and Next's bundled check exclude. Emit stays on TS 5.x.
      - run: pnpm exec turbo run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # No turbo-cache: the `test` task is `cache: false` (turbo.json), so a
      # cache here would be written and never read.
      - uses: ./.github/actions/setup

      # Strictly dependency-free by construction: DB-backed suites are their
      # own `test:integration` task, evals are opt-in behind RUN_MODEL_EVALS.
      - run: pnpm test:metrics
      - run: pnpm test:mutation:tooling

      - run: pnpm exec turbo run test --filter='!api' --filter='!web' --filter='!@workspace/config-interpolation' --filter='!@workspace/runtime-safety'

      # Coverage and function-level CRAP replace the plain test command for
      # these workspaces, so the suite runs once and both thresholds gate CI.
      - run: pnpm exec turbo run test:coverage --filter=web --filter=@workspace/config-interpolation --filter=@workspace/runtime-safety

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck, unit]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: build

      - run: pnpm exec turbo run build --concurrency=1

      # Regenerate the API schema and portable web client in dependency order;
      # a drifted checked-in copy is a failure, not a silent fixup.
      - run: pnpm generate:api-schema
      - run: pnpm generate:web-client
      - run: git diff --exit-code

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job runs API unit + integration coverage itself. Waiting for the
    # unrelated web/package unit job adds latency without catching an API failure.
    needs: [typecheck]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Self-provisioning (Testcontainers in the project's globalSetup): a
      # throwaway Postgres owned by a NON-superuser role that runs the
      # migrations — the worst-case single-role self-hosted deployment, so a
      # green RLS suite proves FORCE constrains even the table owner. Needs
      # host Docker, hence no container image for this job.
      # Runs unit + integration once, then enforces coverage and function-level
      # CRAP from the fresh Istanbul report.
      - run: pnpm --filter api test:coverage

  mutation-api-shard:
    name: Mutation testing (API shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [typecheck, unit, mutation-plan]
    if: needs.mutation-plan.outputs.api_count != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mutation-plan.outputs.api_matrix) }}
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('mutation-pr-{0}-api-{1}', github.event.pull_request.number, matrix.shard) || format('mutation-trusted-api-{0}', matrix.shard) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/stryker-baseline
        id: baseline
        if: needs.mutation-plan.outputs.api_mode == 'full'
        with:
          workspace: apps/api
          cache-file: reports/stryker-incremental-*.json
          cache-suffix: api-shard-${{ matrix.index }}

      - env:
          MUTATION_SHARD: ${{ matrix.shard }}
          MUTATION_BASE: ${{ github.event.pull_request.base.sha }}
          MUTATION_MODE: ${{ needs.mutation-plan.outputs.api_mode }}
        run: |
          arguments=(--shard "$MUTATION_SHARD" --reporters "clear-text,html,json,progress-append-only")
          if [[ "$MUTATION_MODE" == full ]]; then
            arguments+=(--incremental)
          fi
          if [[ -n "$MUTATION_BASE" ]]; then
            arguments+=(--base "$MUTATION_BASE")
          fi
          pnpm --filter api test:mutation:shard -- "${arguments[@]}"

      - name: Save refreshed mutation baseline
        if: success() && needs.mutation-plan.outputs.api_mode == 'full'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/reports/stryker-incremental-*.json
          key: ${{ steps.baseline.outputs.prefix }}${{ steps.baseline.outputs.trust }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-api-${{ matrix.index }}
          path: apps/api/reports/mutation/
          retention-days: 14
          if-no-files-found: error

  mutation-api:
    name: Mutation testing (API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [mutation-api-shard, mutation-plan]
    if: always() && !cancelled()
    steps:
      - name: Require successful mutation execution
        env:
          PLAN_RESULT: ${{ needs.mutation-plan.result }}
          SHARD_RESULT: ${{ needs.mutation-api-shard.result }}
          EXPECTED_SHARDS: ${{ needs.mutation-plan.outputs.api_count }}
        run: |
          [[ "$PLAN_RESULT" == success ]] || exit 1
          if [[ "$EXPECTED_SHARDS" == 0 ]]; then
            echo "No API mutation inputs changed."
          else
            [[ "$SHARD_RESULT" == success ]] || exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: needs.mutation-plan.outputs.api_count != '0'
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        if: needs.mutation-plan.outputs.api_count != '0'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.mutation-plan.outputs.api_count != '0'
        with:
          pattern: mutation-report-api-*
          path: apps/api/reports/mutation-shards

      - run: pnpm test:mutation:aggregate -- --threshold 80 --expected-shards "$EXPECTED_SHARDS" reports/mutation-shards/*/mutation.json
        if: needs.mutation-plan.outputs.api_count != '0'
        env:
          EXPECTED_SHARDS: ${{ needs.mutation-plan.outputs.api_count }}
        working-directory: apps/api

  mutation-packages:
    name: Mutation testing (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [typecheck, unit, mutation-plan]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mutation-plan.outputs.packages) }}
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('mutation-pr-{0}-{1}', github.event.pull_request.number, matrix.package) || format('mutation-trusted-{0}', matrix.package) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: matrix.mode != 'skip'
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup
        if: matrix.mode != 'skip'

      - uses: ./.github/actions/stryker-baseline
        id: baseline
        if: matrix.mode == 'full'
        with:
          workspace: packages/${{ matrix.package }}
          cache-suffix: ${{ matrix.package }}

      - if: matrix.mode != 'skip'
        env:
          MUTATION_PACKAGE: ${{ matrix.package }}
          MUTATION_BASE: ${{ github.event.pull_request.base.sha }}
          MUTATION_MODE: ${{ matrix.mode }}
        run: |
          if [[ "$MUTATION_MODE" == changed ]]; then
            node scripts/mutation-sharding.mjs changed --workspace "packages/$MUTATION_PACKAGE" --base "$MUTATION_BASE"
          else
            pnpm --filter "@workspace/$MUTATION_PACKAGE" test:mutation --incremental --reporters clear-text,html,json,progress-append-only
          fi

      - name: Save refreshed mutation baseline
        if: success() && matrix.mode == 'full'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/${{ matrix.package }}/reports/stryker-incremental.json
          key: ${{ steps.baseline.outputs.prefix }}${{ steps.baseline.outputs.trust }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload mutation report
        if: always() && matrix.mode != 'skip'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-${{ matrix.package }}
          path: packages/${{ matrix.package }}/reports/mutation/
          retention-days: 14
          if-no-files-found: warn

      - if: matrix.mode == 'skip'
        run: echo "No mutation inputs changed for this package."

  component:
    name: Component tests (Storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck, unit]
    # The Playwright image ships the browser and its system libraries, so this
    # job skips `playwright install --with-deps` entirely. Safe here because
    # component tests need a browser but no Docker.
    container:
      # Pinned by digest, like every action here: a retag would otherwise
      # change the browser and base image for an already-reviewed commit.
      # Refresh with the catalog's playwright version:
      #   docker buildx imagetools inspect mcr.microsoft.com/playwright:vX.Y.Z-noble
      image: mcr.microsoft.com/playwright:v1.55.1-noble@sha256:2f29369043d81d6d69a815ceb80760f55e85f5020371ad06a4d996f18503ad1c
      # Chromium renderers allocate from /dev/shm, and Docker's default 64 MB
      # segment is a known crash source under parallel story runs; --ipc=host
      # is Playwright's documented mitigation for Chromium in containers.
      options: --ipc=host
    env:
      # The image ships its browsers at /ms-playwright, but the step's HOME is
      # /github/home, so Playwright would look in ~/.cache and find nothing.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Same locale pinning as the browser-e2e job: Node >=21 derives
      # navigator.language from the process locale, and an invalid tag makes
      # `new Intl.Locale(...)` throw during SSR.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The workflow's own hash is part of the key: this task's turbo inputs
      # don't include the container image, so bumping the Playwright digest
      # would otherwise restore a cache whose stored PASS was produced by the
      # OLD browser — green without ever exercising the new one. Costs one
      # cold cache per ci.yml edit, which is the cheap side of that trade.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-storybook-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            turbo-storybook-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.github/workflows/ci.yml') }}-

      - run: pnpm exec turbo run test:component build --filter=storybook

  browser-e2e:
    name: Product e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The top of the pyramid: everything below it has already passed, so a
    # failure here is a genuine cross-stack defect rather than a unit-level
    # bug wearing a browser costume. The generic build and real-Postgres
    # integration gates must both pass first. Playwright then rebuilds the web
    # app with its E2E API URL; the Storybook component suite is orthogonal.
    needs: [build, integration]
    env:
      # Node >=21 derives navigator.language from the process locale; with
      # LANG=C/unset it reports an invalid tag and `new Intl.Locale(...)`
      # throws during SSR (seen via TanStack Query devtools under Next).
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Host runner (not the Playwright image): this suite boots a throwaway
      # Postgres through the Docker CLI, which a container job cannot reach.
      - run: pnpm exec playwright install --with-deps chromium

      # Boots db + api + worker + the mock model server, builds and starts the
      # production web app, then drives Chromium against the real stack. The
      # ONLY place the browser suite runs — keep it green.
      - run: pnpm test:e2e

      # failure() || cancelled(), NOT !cancelled(): a timed-out or cancelled
      # run is exactly when the trace is worth keeping. Playwright's CI config
      # fails on flaky retries too, so their first-attempt evidence reaches
      # this upload instead of being discarded behind an eventual exit 0.
      - if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
