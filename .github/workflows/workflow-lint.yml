# Thin caller: the jobs live in _workflow-lint.yaml so other repositories can
# reuse the same three checks instead of each keeping its own copy (they had
# already drifted across tools and versions).

name: Workflow lint

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  workflows:
    uses: ./.github/workflows/_workflow-lint.yaml
    permissions:
      contents: read
      # SARIF upload to the Security tab — available because this repo is
      # public. A private repo without Advanced Security passes
      # `advanced-security: false` instead and gets inline annotations.
      security-events: write
