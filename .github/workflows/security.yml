# Dependency advisories, outside the test pyramid (ci.yml) and the static
# gates (lint.yml): a new advisory against an unchanged lockfile is news about
# the registry, not about the code, so it reports on its own.
#
# Actions are pinned to commit SHAs (comment = the release tag they resolve to).

name: Security

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "**/package.json"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/dependency-snapshot.mjs
      - .github/workflows/security.yml
  schedule:
    # Weekly, so an advisory published against an unchanged lockfile still
    # surfaces when no dependency moves.
    - cron: "41 5 * * 1"
  workflow_dispatch:

# Pull request runs supersede each other; each master run has its own group,
# so none is cancelled or replaced while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Blocks a pull request whose lockfile change introduces a package version
  # with a high or critical advisory. Advisories already on the base branch
  # never fail it; the audit below owns those. It compares `pnpm audit` on the
  # base and head lockfiles rather than using GitHub's dependency review,
  # because GitHub's dependency graph reads only the first YAML document of
  # pnpm's lockfile (the pnpm binaries), and sees `catalog:` instead of a
  # version for every catalog dependency.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # `pnpm audit` needs only the lockfile and the workspace manifests that
      # name it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /pnpm-lock.yaml
            /pnpm-workspace.yaml

      - id: node-version
        run: echo "version=$(tr -d '[:space:]' < .node-version)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false
          runtime: node@${{ steps.node-version.outputs.version }}

      # `pnpm audit` exits nonzero whenever it finds an advisory, so the exit
      # code is ignored here; a registry failure yields a report without
      # `advisories`, which the comparison rejects.
      - name: Audit base and head lockfiles
        run: |
          pnpm audit --audit-level high --json > "$RUNNER_TEMP/head.json" || true
          pnpm audit --audit-level high --json --dir base > "$RUNNER_TEMP/base.json" || true

      # An advisory counts as introduced when the head reaches a vulnerable
      # version the base did not, so moving one vulnerable version to another
      # still fails.
      - name: Fail on introduced advisories
        run: |
          node --input-type=module - "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" <<'SCRIPT'
          import { readFileSync } from 'node:fs';

          const findings = (path) => {
            const report = JSON.parse(readFileSync(path, 'utf8'));
            if (typeof report.advisories !== 'object' || report.advisories === null) {
              throw new Error(`${path} is not an audit report: ${JSON.stringify(report).slice(0, 500)}`);
            }
            return Object.values(report.advisories).flatMap((advisory) =>
              advisory.findings.map((finding) => ({
                key: `${advisory.github_advisory_id} ${advisory.module_name}@${finding.version}`,
                advisory,
              })),
            );
          };

          const [basePath, headPath] = process.argv.slice(2);
          const base = new Set(findings(basePath).map(({ key }) => key));
          const introduced = findings(headPath).filter(({ key }) => !base.has(key));
          for (const { key, advisory } of introduced) {
            console.log(`::error::${advisory.severity}: ${key} — ${advisory.title} (patched: ${advisory.patched_versions}) ${advisory.url}`);
          }
          process.exitCode = introduced.length > 0 ? 1 : 0;
          SCRIPT

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # pnpm and Node only: `pnpm audit` reads the lockfile and installs
      # nothing, so the shared setup action's frozen install and store cache
      # would be wasted here.
      - id: node-version
        run: echo "version=$(tr -d '[:space:]' < .node-version)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false
          runtime: node@${{ steps.node-version.outputs.version }}

      # Advisory on pull requests: an advisory published against master should
      # not stop an unrelated change, and the step depends on the registry
      # being up — dependency review already blocks what a pull request itself
      # introduces. Blocking on the weekly schedule and on dependency pushes to
      # master, so a high-severity advisory in a shipped dependency fails a run
      # even when nothing changed.
      - name: Audit production dependencies
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: pnpm audit --prod --audit-level high

      # Build and test tooling never ships in the API or web runtime, so an
      # advisory here is a scheduled-update item rather than a failed run.
      # `!cancelled()` so a production failure above never hides this report.
      - name: Audit development dependencies
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm audit --dev --audit-level high

  # Submits the dependency graph pnpm actually locks, so Dependabot alerts,
  # the dependency graph and the Security tab see every installed package.
  # GitHub's own parser reads only the first YAML document of pnpm's lockfile
  # and records catalog dependencies as `catalog:`; a submitted manifest takes
  # precedence over the statically detected one at the same path. Only the
  # default branch is submitted: the graph and alerts read it, and a fork's
  # pull request token could not write a snapshot anyway.
  dependency-submission:
    name: Dependency submission
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the dependency submission API requires write access
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - id: node-version
        run: echo "version=$(tr -d '[:space:]' < .node-version)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false
          runtime: node@${{ steps.node-version.outputs.version }}

      # Lockfile-only: nothing is installed. One SPDX document per workspace
      # package and scope, so each lands under its own package.json with its
      # dependencies marked runtime or development.
      - name: Generate SBOMs
        run: |
          mkdir -p "$RUNNER_TEMP/sbom/prod" "$RUNNER_TEMP/sbom/dev"
          pnpm list --recursive --depth -1 --json > "$RUNNER_TEMP/importers.json"
          pnpm sbom --lockfile-only --sbom-format spdx --recursive --split --prod --out "$RUNNER_TEMP/sbom/prod/%s.spdx.json"
          pnpm sbom --lockfile-only --sbom-format spdx --recursive --split --dev --out "$RUNNER_TEMP/sbom/dev/%s.spdx.json"

      - name: Submit dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PNPM_VERSION="$(pnpm --version)" node scripts/dependency-snapshot.mjs \
            "$RUNNER_TEMP/importers.json" "$RUNNER_TEMP/sbom/prod" "$RUNNER_TEMP/sbom/dev" \
            > "$RUNNER_TEMP/snapshot.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input "$RUNNER_TEMP/snapshot.json"
