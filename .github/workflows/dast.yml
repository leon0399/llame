name: API DAST (experimental)

# Advisory dynamic scan of the API: Schemathesis (contract, auth and
# object-level authorization checks) and the OWASP ZAP API scan, both driven
# by apps/api/openapi.json against a throwaway stack. Nightly, on demand, and
# on pull requests that change the scan itself; it is not a required check.
on:
  pull_request:
    paths:
      - .github/workflows/dast.yml
      - scripts/dast/**
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  api-scan:
    name: API scan (${{ matrix.scanner }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Each scanner gets its own stack, so one's fuzzed data never shapes the
    # other's findings, and either can be re-run alone.
    strategy:
      fail-fast: false
      matrix:
        scanner: [schemathesis, zap]
    permissions:
      contents: read
      # Upload of ZAP's SARIF to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run scanners
        env:
          DAST_SCANNERS: ${{ matrix.scanner }}
          DAST_OUT_DIR: ${{ github.workspace }}/dast-report
        run: scripts/dast/run-api-scan.sh

      # Schemathesis has no native SARIF output, so only ZAP's is uploaded.
      - if: ${{ !cancelled() && matrix.scanner == 'zap' && hashFiles('dast-report/zap/zap-report.sarif.json') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: dast-report/zap/zap-report.sarif.json
          category: dast-zap

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dast-report-${{ matrix.scanner }}
          path: dast-report/
          retention-days: 14
