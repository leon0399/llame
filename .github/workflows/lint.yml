# Static checks over the SOURCE that need no build, browser or database — the
# cheapest feedback in the pipeline, deliberately its own workflow so a
# formatting nit reports separately from a failing test.
#
# The workflows themselves are linted by workflow-lint.yml (actionlint,
# zizmor, pinact).
#
# Actions are pinned to commit SHAs (comment = the release tag they resolve to).

name: Lint

on:
  pull_request:
  push:
    branches: [master]

# Pull request runs supersede each other; each master run has its own group,
# so none is cancelled or replaced while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: lint

      # This runs inside the required Lint check so invalid proposals and
      # canonical specs block merging, including after sync or archive.
      - name: Validate OpenSpec
        run: pnpm exec openspec validate --all --strict --no-interactive

      # Canonical static gate: root and workspace Oxlint, Markdown, OpenAPI,
      # dead code, duplication, and Halstead difficulty.
      - run: pnpm lint

      # Drizzle's committed per-migration snapshots are a second source of truth
      # for the schema and can drift silently. Hand-authored SQL also needs a
      # matching snapshot; generation catches missing or stale migration metadata.
      - name: Drizzle metadata drift
        env:
          POSTGRES_URL: postgres://unused
        run: |
          pnpm --filter api db:check
          pnpm --filter api db:generate
          git diff --exit-code -- apps/api/src/db/migrations
          test -z "$(git ls-files --others --exclude-standard -- apps/api/src/db/migrations)"

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Whole repo via .oxfmtrc.jsonc's ignorePatterns — the same surface the
      # lefthook pre-commit hook gates per staged file (#175).
      - run: pnpm run format:check

  machine-protocol:
    name: Machine protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # buf lint, the fingerprint and version-bump check against master, and a
      # clean diff after regenerating the committed TypeScript client.
      - run: pnpm --filter @workspace/machine-protocol proto:check

      # The bootstrap package is frozen: no breaking change against master.
      - name: Bootstrap service stays compatible
        run: |
          if git cat-file -e origin/master:packages/machine-protocol/proto/stead/machine/bootstrap/v1/bootstrap.proto; then
            pnpm --filter @workspace/machine-protocol proto:breaking
          fi

  machine-daemon:
    name: Machine daemon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The runner's rustup installs the toolchain and targets that
      # rust-toolchain.toml pins.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - name: Install the cross C compiler for ring
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Static binaries build
        env:
          CC_x86_64_unknown_linux_musl: cc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
        run: cargo build --locked --release -p llame-machine --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
