# Static checks that need no build, no browser and no database — the cheapest
# feedback in the pipeline, deliberately its own workflow so a formatting nit
# reports separately from a failing test instead of hiding inside one job.
#
# Actions are pinned to commit SHAs (comment = the release tag they resolve to).

name: Lint

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # oxlint per workspace; type-aware rules via tsgolint in apps/api.
      - run: pnpm exec turbo run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Whole repo via the root .prettierignore — the same surface the
      # lefthook pre-commit hook gates per staged file (#175).
      - run: pnpm run format:check

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The pipeline lints itself. actionlint catches shell/expression errors
      # in the workflows; zizmor audits the security posture (unpinned
      # actions, injectable expressions, over-broad permissions) this repo
      # already maintains by hand. Both were previously local-only tools.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # Pinned like every action in this repo: a release asset is mutable,
          # so the download is verified before anything executes.
          # Refresh together with the version, from the release's own
          # actionlint_<version>_checksums.txt.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          # GitHub Advanced Security (SARIF → security tab) is not wired up
          # for this repo, and it is mutually exclusive with inline
          # annotations — which are what actually surfaces a finding on the PR.
          advanced-security: false
          annotations: true
