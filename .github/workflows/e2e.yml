name: Product e2e

# The browser stage of CI (ci.yml): the production web app driven by Chromium
# against the real stack. The ONLY place the browser suite runs — keep it
# green.
#
# Actions are pinned to commit SHAs (comment = the release tag they resolve to).

on:
  workflow_call:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      # Node >=21 derives navigator.language from the process locale; with
      # LANG=C/unset it reports an invalid tag and `new Intl.Locale(...)`
      # throws during SSR (seen via TanStack Query devtools under Next).
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Host runner (not the Playwright image): this suite boots a throwaway
      # Postgres through the Docker CLI, which a container job cannot reach.
      - run: pnpm exec playwright install --with-deps chromium

      # Boots db + api + worker + the mock model server, builds and starts the
      # production web app, then drives Chromium against the real stack.
      - run: pnpm test:e2e

      - if: ${{ !cancelled() && hashFiles('test-results/junit.xml') != '' }}
        uses: ./.github/actions/upload-test-results
        with:
          junit: test-results/junit.xml
          flag: e2e

      # failure() || cancelled(), NOT !cancelled(): a timed-out or cancelled
      # run is exactly when the trace is worth keeping. Playwright's CI config
      # fails on flaky retries too, so their first-attempt evidence reaches
      # this upload instead of being discarded behind an eventual exit 0.
      - if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
