name: Mutation baseline refresh

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  api-shard:
    name: Forced API mutation shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
    concurrency:
      group: mutation-trusted-api-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/stryker-baseline
        id: baseline
        with:
          workspace: apps/api
          cache-file: reports/stryker-incremental-*.json
          cache-suffix: api-shard-${{ strategy.job-index }}

      - run: >-
          pnpm --filter api test:mutation:shard -- --shard
          "${{ matrix.shard }}" --incremental --force
          --reporters clear-text,html,json,progress-append-only

      - name: Save rebuilt mutation baseline
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/reports/stryker-incremental-*.json
          key: ${{ steps.baseline.outputs.prefix }}trusted-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-forced-api-${{ strategy.job-index }}
          path: apps/api/reports/mutation/
          retention-days: 30
          if-no-files-found: error

  api-summary:
    name: Forced API mutation summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [api-shard]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-report-forced-api-*
          path: apps/api/reports/mutation-shards

      - run: pnpm test:mutation:check
        working-directory: apps/api

  config-interpolation:
    name: Forced config-interpolation mutation run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: mutation-trusted-config-interpolation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/stryker-baseline
        id: baseline
        with:
          workspace: packages/config-interpolation

      - run: >-
          pnpm --filter @workspace/config-interpolation test:mutation
          --incremental --force
          --reporters clear-text,html,json,progress-append-only

      - name: Save rebuilt mutation baseline
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/config-interpolation/reports/stryker-incremental.json
          key: ${{ steps.baseline.outputs.prefix }}trusted-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-forced-config-interpolation
          path: packages/config-interpolation/reports/mutation/
          retention-days: 30
          if-no-files-found: warn
