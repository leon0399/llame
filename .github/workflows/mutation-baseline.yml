# Forced counterpart to ci.yml's incremental mutation job. Both workflows use
# .github/actions/stryker-baseline and the repository-wide mutation-baseline
# concurrency group; change their writer conditions together.

name: Mutation baseline refresh

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  refresh:
    name: Forced full mutation run (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            package: api
            path: apps/api
            slug: api
            timeout: 360
            external: apps/api/{openapi.json,nest-cli.json,llame.config.json.example,src/instance-config/llame.config.schema.json,src/prompts/chat-default.md,src/search/chat/eval/BASELINE.md,src/search/chat/eval/dataset.ts,src/mcp/**/*.mjs,src/testing/**,src/db/migrations/**/*.sql,src/db/migrations/meta/**/*.json}
            dependency: packages/config-interpolation/{package.json,src/**}
          - name: Config interpolation
            package: "@workspace/config-interpolation"
            path: packages/config-interpolation
            slug: config-interpolation
            timeout: 60
    concurrency:
      group: mutation-trusted-${{ matrix.slug }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Restore is still useful for report continuity, but --force below reruns
      # every current mutant. The merge-time counterpart is ci.yml#mutation.
      - uses: ./.github/actions/stryker-baseline
        id: baseline
        with:
          workspace: ${{ matrix.path }}
          external-pattern: ${{ matrix.external || '' }}
          external-pattern-2: ${{ matrix.dependency || '' }}

      - run: pnpm --filter "${{ matrix.package }}" test:mutation --incremental --force

      - name: Save rebuilt mutation baseline
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.path }}/reports/stryker-incremental.json
          key: ${{ steps.baseline.outputs.prefix }}trusted-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-forced-${{ matrix.slug }}
          path: |
            ${{ matrix.path }}/reports/mutation/
            !${{ matrix.path }}/reports/stryker-incremental.json
          retention-days: 30
          if-no-files-found: warn
