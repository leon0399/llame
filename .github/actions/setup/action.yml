name: Setup workspace
description: >-
  pnpm + Node (pinned by .node-version) + a frozen-lockfile install, and
  optionally the Turborepo local cache for a task.

# Every CI job repeats the same setup after checkout. It lives here so a
# Node/pnpm change is one edit instead of one per job, and so each job's YAML
# is only what makes that job different.

inputs:
  turbo-cache:
    description: >-
      Cache namespace for this job's `.turbo/cache` (e.g. "unit"). Each job
      gets its own so they don't contend for one exact-key save. Leave empty
      for jobs that run no turbo task, or that need a bespoke key.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Container jobs check out as a different UID than the container user, so
    # git rejects the workspace as "dubious ownership" and the `prepare`
    # script (lefthook install) dies. No-op on host runners.
    - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      shell: bash

    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      # version comes from package.json "packageManager"

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ".node-version"
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # Exact-key save per commit, prefix fallback to the newest prior cache:
    # unchanged turbo tasks replay instead of re-executing.
    - if: inputs.turbo-cache != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ inputs.turbo-cache }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ inputs.turbo-cache }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ inputs.turbo-cache }}-${{ runner.os }}-
