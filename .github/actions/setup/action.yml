name: Setup workspace
description: pnpm + Node (pinned by .node-version) + a frozen-lockfile install.

# Every CI job repeats the same setup steps after checkout. They live here so
# a Node/pnpm change is one edit instead of one per job, and so each job's
# YAML is only what makes that job different.
runs:
  using: composite
  steps:
    # Container jobs check out as a different UID than the container user, so
    # git rejects the workspace as "dubious ownership" and the `prepare`
    # script (lefthook install) dies. No-op on host runners.
    - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      shell: bash

    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      # version comes from package.json "packageManager"

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ".node-version"
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
