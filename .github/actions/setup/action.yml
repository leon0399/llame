name: Setup workspace
description: pnpm + Node (pinned by .node-version) + a frozen-lockfile install.

# Every CI job repeats the same three setup steps after checkout. They live
# here so a Node/pnpm change is one edit instead of seven, and so each job's
# YAML is only what makes that job different.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      # version comes from package.json "packageManager"

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ".node-version"
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
