name: Restore Stryker baseline
description: >-
  Compute the mutation-environment fingerprint and restore the newest
  compatible Stryker incremental report. Callers own execution and saving.

inputs:
  workspace:
    description: Workspace path relative to the repository root.
    required: true
  external-pattern:
    description: Additional non-mutated inputs consumed by the tests.
    required: false
    default: ""
  external-pattern-2:
    description: Second additional input pattern.
    required: false
    default: ""

outputs:
  prefix:
    description: Immutable-cache restore prefix for this environment.
    value: ${{ steps.fingerprint.outputs.prefix }}
  trust:
    description: Cache trust class for this run.
    value: ${{ steps.fingerprint.outputs.trust }}
  matched-key:
    description: Cache key restored by actions/cache, or empty on a cold run.
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    - name: Compute mutation-environment fingerprint
      id: fingerprint
      shell: bash
      env:
        TRUST: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'trusted' }}
        INPUT_HASH: >-
          ${{ hashFiles(
            'pnpm-lock.yaml',
            'package.json',
            '.node-version',
            '.github/actions/setup/action.yml',
            '.github/actions/stryker-baseline/action.yml',
            format('{0}/package.json', inputs.workspace),
            format('{0}/stryker.config.json', inputs.workspace),
            format('{0}/vitest*.config.*', inputs.workspace),
            format('{0}/tsconfig*.json', inputs.workspace),
            inputs.external-pattern,
            inputs.external-pattern-2
          ) }}
      run: |
        echo "prefix=stryker-v2-${RUNNER_OS}-${INPUT_HASH}-" >> "$GITHUB_OUTPUT"
        echo "trust=${TRUST}" >> "$GITHUB_OUTPUT"

    - name: Restore compatible mutation baseline
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.workspace }}/reports/stryker-incremental.json
        key: ${{ steps.fingerprint.outputs.prefix }}${{ steps.fingerprint.outputs.trust }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.fingerprint.outputs.prefix }}${{ steps.fingerprint.outputs.trust }}-
          ${{ steps.fingerprint.outputs.prefix }}trusted-
