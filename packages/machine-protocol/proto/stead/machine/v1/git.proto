syntax = "proto3";

package stead.machine.v1;

import "google/protobuf/timestamp.proto";

// GitService reads repositories under the roots and manages their worktrees. Every path is
// absolute and goes through root enforcement, including the repository's own data (git dir,
// common dir, objects, alternates): data outside every root is OUTSIDE_ROOTS. Failures carry git's
// raw standard error; the installation rewrites root prefixes into locators.
service GitService {
  // GetRepository reports the repository that holds a path.
  rpc GetRepository(GetRepositoryRequest) returns (GetRepositoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // LocateRepository reports the nearest .git entry without starting git.
  rpc LocateRepository(LocateRepositoryRequest) returns (LocateRepositoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetStatus reads the working-tree state for the admitted git entry.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateWorktree adds a worktree on a new branch. A resend with the same request id returns
  // the first result.
  rpc CreateWorktree(CreateWorktreeRequest) returns (CreateWorktreeResponse) {}
  rpc ListWorktrees(ListWorktreesRequest) returns (ListWorktreesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // DeleteWorktree removes a registered worktree without force.
  rpc DeleteWorktree(DeleteWorktreeRequest) returns (DeleteWorktreeResponse) {}
}

enum GitFailureReason {
  GIT_FAILURE_REASON_UNSPECIFIED = 0;
  // No repository holds the path.
  GIT_FAILURE_REASON_NOT_A_REPOSITORY = 1;
  // The repository's data lies outside every root.
  GIT_FAILURE_REASON_OUTSIDE_ROOTS = 2;
  // Refused before git started; `message` says why.
  GIT_FAILURE_REASON_INVALID_INPUT = 3;
  GIT_FAILURE_REASON_TIMED_OUT = 4;
  GIT_FAILURE_REASON_OUTPUT_TOO_LARGE = 5;
  GIT_FAILURE_REASON_ENTRY_CHANGED = 6;
  GIT_FAILURE_REASON_ROOT_MISSING = 7;
  GIT_FAILURE_REASON_NO_REPOSITORY_IN_ROOT = 8;
  // The environment copy of a new worktree failed; `message` is a fixed phrase plus at most one
  // relative path, never stderr, OS error text, manifest lines, or file bytes.
  GIT_FAILURE_REASON_COPY_FAILED = 9;
  // git exited non-zero for a reason without its own value; `stderr` says why. Kept last so a
  // later specific reason slots in before it.
  GIT_FAILURE_REASON_GIT_FAILED = 255;
}

message GitFailure {
  GitFailureReason reason = 1;
  string message = 2;
  // Bounded standard error of the git process; empty when none ran.
  string stderr = 3;
}

message Remote {
  string name = 1;
  // As configured; the installation normalizes it.
  string url = 2;
}

message GetRepositoryRequest {
  string path = 1;
}

message GetRepositoryResponse {
  oneof result {
    Repository repository = 1;
    GitFailure failure = 2;
  }
}
message LocateRepositoryRequest {
  string path = 1;
}

message LocateRepositoryResponse {
  oneof result {
    string git_entry = 1;
    GitFailure failure = 2;
  }
}


message Repository {
  // The working tree that holds the path.
  string worktree = 1;
  // The `.git` directory or file of that working tree.
  string git_dir = 2;
  // The common directory; equals git_dir for a main working tree.
  string common_dir = 3;
  // The main working tree when this one is linked.
  optional string main_worktree = 4;
  repeated Remote remotes = 5;
  // Unset when HEAD is detached.
  optional string branch = 6;
  // Full commit id; unset on an unborn branch.
  optional string head = 7;
}

enum SubmoduleMode {
  SUBMODULE_MODE_UNSPECIFIED = 0;
  SUBMODULE_MODE_SKIP = 1;
  SUBMODULE_MODE_CHECK = 2;
}

message GetStatusRequest {
  string path = 1;
  // Most changed paths listed; 0 means the daemon's default of 100, at most 1000.
  uint32 max_entries = 2;
  SubmoduleMode submodules = 3;
  // Most recent commits listed; 0 means none.
  uint32 max_commits = 4;
  // Git entry previously admitted by LocateRepository.
  string git_entry = 5;
}

message GetStatusResponse {
  oneof result {
    Status status = 1;
    GitFailure failure = 2;
  }
}

message Status {
  Repository repository = 1;
  // The requested path relative to the working tree, `/`-separated; empty when equal.
  string relative_path = 2;
  optional Upstream upstream = 3;
  optional Operation operation = 4;
  ChangeCounts counts = 5;
  repeated Change changes = 6;
  // Changed paths not listed because of `max_entries`.
  uint32 omitted = 7;
  repeated string submodules = 8;
  // Most recent first.
  repeated Commit commits = 9;
}

message Upstream {
  string name = 1;
  bool gone = 2;
  optional uint32 ahead = 3;
  optional uint32 behind = 4;
  // The upstream ref's last reflog entry.
  optional google.protobuf.Timestamp updated_at = 5;
}

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_MERGE = 1;
  OPERATION_KIND_REBASE = 2;
  OPERATION_KIND_AM = 3;
  OPERATION_KIND_CHERRY_PICK = 4;
  OPERATION_KIND_REVERT = 5;
  OPERATION_KIND_BISECT = 6;
}

// An operation in progress, such as a rebase at step 2 of 5.
message Operation {
  OperationKind kind = 1;
  optional uint32 step = 2;
  optional uint32 total = 3;
}

message ChangeCounts {
  uint32 staged = 1;
  uint32 unstaged = 2;
  uint32 untracked = 3;
  uint32 conflicted = 4;
}

message Change {
  // Two porcelain status characters; untracked is "??".
  string status = 1;
  // Relative to the working tree.
  string path = 2;
  // The source of a rename.
  optional string from = 3;
}

message Commit {
  string id = 1;
  string subject = 2;
}

message CreateWorktreeRequest {
  string request_id = 1;
  // The main working tree.
  string repository = 2;
  // A valid branch name; refused as INVALID_INPUT otherwise.
  string branch = 3;
  // The commit-ish the branch starts from; unset means HEAD.
  optional string base = 4;
  // Where the worktree goes; must lie inside a root.
  string path = 5;
  // The selected checkout root whose `.worktreeinclude` seeds the new worktree. Distinct from
  // `repository`; an empty or option-like value is refused as INVALID_INPUT.
  string copy_source = 6;
}

message CreateWorktreeResponse {
  oneof result {
    Worktree worktree = 1;
    GitFailure failure = 2;
  }
}

message ListWorktreesRequest {
  string repository = 1;
}

message ListWorktreesResponse {
  oneof result {
    Worktrees worktrees = 1;
    GitFailure failure = 2;
  }
}

message Worktrees {
  // The main working tree first.
  repeated Worktree worktrees = 1;
}

message Worktree {
  string path = 1;
  // Unset when detached.
  optional string branch = 2;
  optional string head = 3;
  bool locked = 4;
  bool prunable = 5;
}

message DeleteWorktreeRequest {
  string request_id = 1;
  string path = 2;
}

message DeleteWorktreeResponse {
  oneof result {
    Deleted deleted = 1;
    GitFailure failure = 2;
  }
}

message Deleted {}
