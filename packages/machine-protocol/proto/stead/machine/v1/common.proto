syntax = "proto3";

// The main Machine service. Every change to this package bumps the protocol
// version in `packages/machine-protocol/proto/protocol.json`; CI compares the
// recorded schema fingerprint.
package stead.machine.v1;

// What every call carries besides its arguments. The deadline is the gRPC
// timeout, never a field.
message Envelope {
  // The tool call the request serves; used in daemon logs only.
  string tool_call_id = 1;
  // The caller's trace, in the `sentry-trace` and `baggage` header formats.
  string sentry_trace = 2;
  string baggage = 3;
}

// A domain outcome that refused or failed the operation after the request was
// accepted. `type` is the operation's documented failure vocabulary.
message Failure {
  string type = 1;
  string message = 2;
  optional uint32 count = 3;
}

message LineRange {
  uint32 start_line = 1;
  uint32 end_line = 2;
}

// A range that may be explicitly absent: an unset field is "not reported",
// a set field with no `range` is "reported as none".
message OptionalLineRange {
  optional LineRange range = 1;
}
