syntax = "proto3";

package stead.machine.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// JobService runs every command as a job with a record and output files on the Machine. The
// daemon knows nothing of foreground, background, or waiting; the installation decides those from
// the Watch stream. Each job carries an opaque owner, and a call on a job whose owner differs fails
// as JOB_NOT_FOUND, like an unknown id.
service JobService {
  // CreateJob starts `bash -c command`. The job id is the request id: a resend returns the running
  // job. At the running-job limit the call is refused with JOB_LIMIT.
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse) {}
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // WatchJobs sends every job, then a snapshot_end marker, then each job on every change, for as
  // long as the connection lasts.
  rpc WatchJobs(WatchJobsRequest) returns (stream WatchJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ReadOutput streams one output stream of a job from an offset to its current end.
  rpc ReadOutput(ReadOutputRequest) returns (stream ReadOutputResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CancelJob kills the job's process group and proves it ended. An unproved kill settles the job
  // LOST.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {}
  // DeleteJob removes a settled job's record and output once the installation holds its copy. A
  // running job is refused with JOB_RUNNING.
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse) {}
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_RUNNING = 1;
  JOB_STATE_SUCCEEDED = 2;
  JOB_STATE_FAILED = 3;
  JOB_STATE_CANCELLED = 4;
  JOB_STATE_TIMED_OUT = 5;
  // The daemon cannot say how the job ended; `lost_cause` says why.
  JOB_STATE_LOST = 6;
}

enum LostCause {
  LOST_CAUSE_UNSPECIFIED = 0;
  LOST_CAUSE_DAEMON_RESTARTED = 1;
  LOST_CAUSE_MACHINE_REBOOTED = 2;
  LOST_CAUSE_CANCEL_UNPROVED = 3;
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
}

message Job {
  // 32 lowercase hex characters, drawn by the installation.
  string id = 1;
  string owner = 2;
  JobState state = 3;
  google.protobuf.Timestamp created_at = 4;
  optional google.protobuf.Timestamp ended_at = 5;
  // After this long the daemon ends the job as TIMED_OUT; unset means never.
  optional google.protobuf.Duration timeout = 6;
  // Exit status when the process exited; unset when a signal ended it or the job is not settled.
  optional int32 exit_code = 7;
  // The signal that ended the process, such as "KILL".
  optional string signal = 8;
  Output stdout = 9;
  Output stderr = 10;
  LostCause lost_cause = 11;
}

// What is recorded of one output stream.
message Output {
  uint64 bytes = 1;
  // The Machine's output limit stopped recording; the process kept running.
  bool truncated = 2;
}

message CreateJobRequest {
  // The job id, which is also the request id.
  string job_id = 1;
  string owner = 2;
  string command = 3;
  // Must lie inside a root; unset means the first root.
  optional string cwd = 4;
  // Added to the daemon's base environment.
  map<string, string> env = 5;
  optional google.protobuf.Duration timeout = 6;
}

message CreateJobResponse {
  oneof result {
    Job job = 1;
    CreateJobFailure failure = 2;
  }
}

enum CreateJobFailureReason {
  CREATE_JOB_FAILURE_REASON_UNSPECIFIED = 0;
  // `bash` or the working directory is unavailable.
  CREATE_JOB_FAILURE_REASON_UNAVAILABLE = 1;
}

message CreateJobFailure {
  CreateJobFailureReason reason = 1;
  string message = 2;
}

message GetJobRequest {
  string job_id = 1;
  string owner = 2;
}

message GetJobResponse {
  Job job = 1;
}

message ListJobsRequest {}

message ListJobsResponse {
  repeated Job jobs = 1;
  uint32 running = 2;
}

message WatchJobsRequest {}

message WatchJobsResponse {
  oneof event {
    Job job = 1;
    SnapshotEnd snapshot_end = 2;
  }
}

message SnapshotEnd {}

message ReadOutputRequest {
  string job_id = 1;
  string owner = 2;
  OutputStream stream = 3;
  uint64 offset = 4;
  // Most bytes to send; 0 means to the current end.
  uint64 limit = 5;
}

message ReadOutputResponse {
  // The offset of `data` in the output.
  uint64 offset = 1;
  bytes data = 2;
}

message CancelJobRequest {
  string request_id = 1;
  string job_id = 2;
  string owner = 3;
}

message CancelJobResponse {
  Job job = 1;
}

message DeleteJobRequest {
  string request_id = 1;
  string job_id = 2;
  string owner = 3;
}

message DeleteJobResponse {}
