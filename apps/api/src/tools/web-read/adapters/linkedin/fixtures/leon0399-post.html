        "articleBody": "Last week at Madrid Tech Brunch, I was surprised by how many people asked me to share my AI tooling setup.\n\nSo here are the tools I actually use day to day:\n\nOMP — omp.sh\n\nHands-down the best CLI harness I’ve found for using different providers and models together.\n\nI use GPT-6 Astra / Sol for planning and specs, Opus 5.5 for implementation orchestration, and DeepSeek v4.1 Flash for subagents. OMP lets me use them all in one session instead of being locked to one vendor.\n\n→ Model roles + usage balancing\nIf I end the week with unused Codex allowance, OMP can shift some subagent work to GPT-5.6 Luna instead of wasting it.\n\n→ Local conversation compaction\nOnce an old session falls out of provider cache, recompacting a ~0.9M-token conversation remotely can make a painful dent in usage. I use local Qwen for old sessions and remote compaction only while the cache is hot.\n\n→ Parallel skills\nWorkflows like /orchestrate → /openspec-explore → /gh-stack can happen as one workflow instead of isolated commands.\n\n→ Local memory + time travel\nOMP can extract reusable learnings from sessions, and if an agent goes too far in the wrong direction, it can roll back while carrying forward a summary of what went wrong.\n\nHERDR — herdr.dev\n\nAn agent-first terminal multiplexer, especially useful for remote development.\n\nI increasingly run agents on remote workboxes: it saves battery, lets me leave without pausing work, and reduces the chance of a hallucinating AI doing something stupid to my disk 😅\n\nHerdr lets me manage agents across several servers from one window, keeps them running when I disconnect, and shows whether they’re working, stuck, done, or waiting for input.\n\nPLANNOTATOR — plannotator.ai\n\nProbably the best code/spec review UI I’ve used.\n\n→ Guided Review\nA small model analyzes the PR diff first and builds an interactive review path: where to look, what deserves attention, and what looks risky.\n\nI’m spoiled by it now — I even use it for human-written code.\n\nOPENSPEC — openspec.dev\n\nThis is where “vibecoding” starts turning into an actual agentic SDLC.\n\nInstead of letting the agent implement whatever it thinks you meant, OpenSpec makes it explore the feature and prepare a strict spec first. Combined with Matt Pocock’s /grilling skill, it helps surface wrong assumptions and ambiguities before implementation.\n\nSlower and more token-expensive, but extremely useful for larger work where you care about what actually ships.\n\nGITHUB PR STACKS — gh.io/stacks\n\nAgents can ship code faster than we can review it.\n\nStacked PRs split one horrifying 4,000-line change into smaller PRs by intent, reviewed individually and merged as a stack.\n\nMuch easier than giving up on reviewing one giant PR altogether.\n\n#AIAgents #DeveloperTools #SoftwareEngineering",
