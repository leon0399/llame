asyncapi: 3.1.0
info:
  title: llame live updates
  version: '0.2'
  description: |
    Owner-scoped record updates pushed from the API to signed-in clients over
    one WebSocket, so clients keep their caches current without refetching.

    Record payloads are the same schemas the HTTP API returns
    (`openapi.json`): a `chat.upserted` carries the chat exactly as
    `GET /api/v1/chats` lists it. The server reads each record as its owner,
    under the same authorization as the HTTP API, and a connection receives
    only records owned by its authenticated user.

    This document is the protocol's source of truth. The API's and web
    client's message types and runtime validators are generated from it.
defaultContentType: application/json
servers:
  api:
    host: localhost:3001
    protocol: ws
    description: |
      The llame API origin. Use `wss` behind TLS. The upgrade is refused
      with `401` without a valid session and with `403` when a browser
      `Origin` is not an allowed web origin.
    security:
      - $ref: '#/components/securitySchemes/sessionCookie'
      - $ref: '#/components/securitySchemes/bearerToken'
channels:
  live:
    address: /api/v1/live
    title: Live updates
    description: |
      One connection per tab or device. The server ignores inbound frames.
      Messages sent while a client was disconnected are not replayed: on
      every (re)connect, and on `resync`, a client refetches what it shows.
    messages:
      chatUpserted:
        $ref: '#/components/messages/chatUpserted'
      chatDeleted:
        $ref: '#/components/messages/chatDeleted'
      projectUpserted:
        $ref: '#/components/messages/projectUpserted'
      projectDeleted:
        $ref: '#/components/messages/projectDeleted'
      pinsReplaced:
        $ref: '#/components/messages/pinsReplaced'
      runUpdated:
        $ref: '#/components/messages/runUpdated'
      runProgress:
        $ref: '#/components/messages/runProgress'
      resync:
        $ref: '#/components/messages/resync'
    bindings:
      ws:
        method: GET
        bindingVersion: 0.1.0
operations:
  sendLiveUpdate:
    action: send
    channel:
      $ref: '#/channels/live'
    summary: The API pushes a record update to the owner's connections.
    messages:
      - $ref: '#/channels/live/messages/chatUpserted'
      - $ref: '#/channels/live/messages/chatDeleted'
      - $ref: '#/channels/live/messages/projectUpserted'
      - $ref: '#/channels/live/messages/projectDeleted'
      - $ref: '#/channels/live/messages/pinsReplaced'
      - $ref: '#/channels/live/messages/runUpdated'
      - $ref: '#/channels/live/messages/runProgress'
      - $ref: '#/channels/live/messages/resync'
components:
  securitySchemes:
    sessionCookie:
      type: httpApiKey
      in: cookie
      name: llame_session
      description: The browser session cookie, sent with the upgrade request.
    bearerToken:
      type: http
      scheme: bearer
      description: A session token, for non-browser clients.
  messages:
    chatUpserted:
      name: chat.upserted
      title: Chat created or updated
      summary: The chat as `GET /api/v1/chats` lists it, after any change (rename, filing, archive, new message).
      payload:
        $ref: '#/components/schemas/ChatUpsertedMessage'
    chatDeleted:
      name: chat.deleted
      title: Chat deleted
      payload:
        $ref: '#/components/schemas/ChatDeletedMessage'
    projectUpserted:
      name: project.upserted
      title: Project created or updated
      payload:
        $ref: '#/components/schemas/ProjectUpsertedMessage'
    projectDeleted:
      name: project.deleted
      title: Project deleted
      payload:
        $ref: '#/components/schemas/ProjectDeletedMessage'
    pinsReplaced:
      name: pins.replaced
      title: Pins replaced
      summary: The owner's complete pinned list, in `GET /api/v1/pins` order, after any pin, unpin, or reorder.
      payload:
        $ref: '#/components/schemas/PinsReplacedMessage'
    runUpdated:
      name: run.updated
      title: Run created or status changed
      summary: The Run as `GET /api/v1/runs/{id}` returns it.
      payload:
        $ref: '#/components/schemas/RunUpdatedMessage'
    runProgress:
      name: run.progress
      title: Run progress
      summary: A Run's activity phase or step changed. Sent once per change, not per streamed token.
      payload:
        $ref: '#/components/schemas/RunProgressMessage'
    resync:
      name: resync
      title: Resync
      summary: Updates may have been missed (the server's change listener reconnected); refetch what is shown.
      payload:
        $ref: '#/components/schemas/ResyncMessage'
  schemas:
    ChatUpsertedMessage:
      schemaFormat: application/vnd.oai.openapi;version=3.0.0
      schema:
        type: object
        additionalProperties: false
        required:
          - type
          - chat
        properties:
          type:
            type: string
            enum:
              - chat.upserted
          chat:
            $ref: ./openapi.json#/components/schemas/ChatListItemResponse
    ChatDeletedMessage:
      schemaFormat: application/vnd.oai.openapi;version=3.0.0
      schema:
        type: object
        additionalProperties: false
        required:
          - type
          - chatId
        properties:
          type:
            type: string
            enum:
              - chat.deleted
          chatId:
            type: string
            format: uuid
    ProjectUpsertedMessage:
      schemaFormat: application/vnd.oai.openapi;version=3.0.0
      schema:
        type: object
        additionalProperties: false
        required:
          - type
          - project
        properties:
          type:
            type: string
            enum:
              - project.upserted
          project:
            $ref: ./openapi.json#/components/schemas/ProjectResponse
    ProjectDeletedMessage:
      schemaFormat: application/vnd.oai.openapi;version=3.0.0
      schema:
        type: object
        additionalProperties: false
        required:
          - type
          - projectId
        properties:
          type:
            type: string
            enum:
              - project.deleted
          projectId:
            type: string
            format: uuid
    PinsReplacedMessage:
      schemaFormat: application/vnd.oai.openapi;version=3.0.0
      schema:
        type: object
        additionalProperties: false
        required:
          - type
          - items
        properties:
          type:
            type: string
            enum:
              - pins.replaced
          items:
            type: array
            items:
              oneOf:
                - $ref: ./openapi.json#/components/schemas/ChatPinnedItemResponse
                - $ref: ./openapi.json#/components/schemas/ProjectPinnedItemResponse
              discriminator:
                propertyName: itemType
    RunUpdatedMessage:
      schemaFormat: application/vnd.oai.openapi;version=3.0.0
      schema:
        type: object
        additionalProperties: false
        required:
          - type
          - run
        properties:
          type:
            type: string
            enum:
              - run.updated
          run:
            $ref: ./openapi.json#/components/schemas/RunResponse
    RunProgressMessage:
      schemaFormat: application/vnd.oai.openapi;version=3.0.0
      schema:
        type: object
        additionalProperties: false
        required:
          - type
          - runId
          - chatId
          - phase
          - step
        properties:
          type:
            type: string
            enum:
              - run.progress
          runId:
            type: string
            format: uuid
          chatId:
            type: string
            format: uuid
          phase:
            type: string
            description: Coarse activity derived from run events.
            enum:
              - queued
              - thinking
              - tool
              - writing
          step:
            type: integer
            minimum: 0
            description: Model requests made so far in this Run.
    ResyncMessage:
      schemaFormat: application/vnd.oai.openapi;version=3.0.0
      schema:
        type: object
        additionalProperties: false
        required:
          - type
        properties:
          type:
            type: string
            enum:
              - resync
