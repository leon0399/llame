id: no-inline-inject-parameter-decorator
language: TypeScript
severity: error
message: Place `@Inject(...)` on the line before its constructor parameter.
files:
  - "apps/api/src/**/*.ts"
rule:
  all:
    - any:
        - kind: required_parameter
        - kind: optional_parameter
    - has:
        pattern: "@Inject($TOKEN)"
        stopBy: end
    - regex: "@Inject\\([^\\n]*\\)[ \\t]+"
    - inside:
        kind: method_definition
        regex: "^constructor\\("
        stopBy: end
