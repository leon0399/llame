packages:
  - "apps/*"
  - "packages/*"

# Fail installs on a Node version outside the declared `engines` floor
# (>=22.19) instead of only warning. Moved off `.npmrc` in pnpm 11 (that file
# is auth/registry-only). The reproducible development pin lives in
# `.node-version`.
engineStrict: true

# pnpm 11.0 Security & build defaults, written explicitly so a later major
# cannot silently flip them. https://pnpm.io/blog/releases/11.0
# `minimumReleaseAge` stays 10080 (7d); 11's default is 1440.
# Strict (pnpm 12's default whenever `minimumReleaseAge` is set): `pnpm add` of
# a version younger than the cooldown fails instead of silently appending it to
# `minimumReleaseAgeExclude`, so every exclusion below is a reviewed decision.
minimumReleaseAgeStrict: true
# Install and dedupe drop exact-version exclusions once that version has aged
# past the cooldown; name patterns stay.
minimumReleaseAgeExcludePrune: true
blockExoticSubdeps: true
strictDepBuilds: true
optimisticRepeatInstall: true
verifyDepsBeforeRun: install

# Supply-chain release cooldown (pnpm >=10.16): refuse to *resolve* a package
# version until it has been on the registry this many minutes, so a compromised
# release has a detection window before it can enter the lockfile. 10080 = 7
# days — a wide margin that also covers slower-detected compromises, not just
# the same-day ones. Friction is near-zero here: the catalog pins versions and
# CI installs with --frozen-lockfile, which skips re-resolution and so ignores
# this, so only manual `pnpm add` / `pnpm update` are gated (and an urgent
# hotfix can be listed under minimumReleaseAgeExclude below).
# https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Tracks fresh dated dev builds (see catalog pin); a new build is younger than
  # the cooldown by design, so it would otherwise block bumping. Exact versions
  # still land in the lockfile, so this exclusion widens no other attack surface.
  - "@typescript/native-preview"
  # oxc-resolver (a storybook transitive) releases several times a month and
  # co-publishes ~20 platform-binding packages minutes after the parent, so a
  # matching mature set often doesn't exist inside any 7-day window — resolving
  # the storybook subtree then fails on whichever binding is youngest. Accepted
  # tradeoff: this family skips the cooldown (it's already in the lockfile;
  # bindings are only ever pulled at the parent's exact version).
  - oxc-resolver
  - "@oxc-resolver/*"
  # Every other exclusion that stood here has aged past the 7-day window and is
  # gone: `storyproof` (2026-07-26), `@barney-media/crap-typescript` and its
  # `-core` (2026-08-29), `fast-xml-parser@5.11.1` (2026-08-27),
  # `@shadcn/lint@0.1.0` (2026-09-14), and `zod@4.6.5` (2026-09-13). Those
  # versions stay in the lockfile and in the catalog; they simply no longer
  # need to skip the cooldown to be resolved.

# One shared version per dependency used by 2+ workspaces — reference with
# "catalog:" in package.json. Single edit point, no cross-package drift.
catalog:
  "@ai-sdk/mcp": 1.0.71
  "@base-ui/react": ^1.6.0
  "@hookform/resolvers": ^5.1.1
  "@radix-ui/react-use-controllable-state": 1.2.3
  # Pinned exact, alongside `@ai-sdk/mcp`: apps/api pairs the AI SDK's MCP
  # client with this package's `StdioClientTransport`, so the two move
  # together. Only the stdio transport is used from here — the HTTP path
  # stays on `@ai-sdk/mcp`'s own transport. 1.31.0 clears the GHSA-6qxp
  # advisory; it is the newest release whose transport surface apps/api uses
  # unchanged.
  "@modelcontextprotocol/sdk": 1.31.0
  # `@playwright/test` and `playwright` are separate packages that MUST move
  # together: they share a `playwright-core`, and `playwright install` only
  # fetches the browser build its own version pins. A split (root on one
  # version, apps/storybook on another) leaves the browser the other half
  # needs uninstalled — Storybook's browser-mode suite then launches nothing
  # and reports zero tests. Bump both entries in the same change.
  "@playwright/test": 1.55.1
  playwright: 1.55.1
  "@tailwindcss/postcss": ^4.3.2
  "@tailwindcss/typography": ^0.5.16
  # Node floor is 22.19 (engines); .node-version pins 22.23.1 for development.
  "@types/node": ^22.16.5
  "@types/react": ^19.0.10
  "@types/react-dom": ^19.0.4
  "@typescript/native-preview": 7.0.0-dev.20260703.1
  # apps/storybook and apps/web both run stories as browser-mode tests, so
  # the addon and the browser provider are shared.
  "@storybook/addon-vitest": ^10.5.0
  "@storybook/nextjs-vite": ^10.5.0
  "@stryker-mutator/core": 9.6.1
  "@stryker-mutator/typescript-checker": 9.6.1
  "@stryker-mutator/vitest-runner": 9.6.1
  "@tanstack/react-query": ^5.81.5
  ai: 6.0.256
  class-variance-authority: ^0.7.1
  lucide-react: ^1.22.0
  motion: ^12.23.0
  # apps/web and apps/storybook must run the same Next (storybook compiles ui
  # stories through Next's compiler via @storybook/nextjs-vite).
  # Patch-level on purpose: 16.3.8 carries the 16.3 line's security fixes, and a
  # caret here would resolve 16.4.0 (2026-10-06) on the next re-resolution —
  # a minor llame adopts deliberately, not as a side effect of a security pass.
  next: ~16.3.8
  next-themes: ^0.4.4
  oxlint: 1.82.0
  oxlint-tsgolint: 7.0.2001
  prettier: ^3.5.1
  react: ^19.2.7
  react-dom: ^19.2.7
  react-hook-form: ^7.59.0
  shadcn: 4.13.0
  shiki: ^3.23.0
  sonner: ^2.0.5
  storybook: ^10.5.0
  streamdown: 2.5.0
  tsx: ^4.23.12
  typescript: 5.9.3
  use-stick-to-bottom: ^1.1.1
  # Exact, not a range: vitest warns and may misbehave when the
  # coverage provider's version differs from its own, and vitest
  # itself is lockfile-pinned at 4.1.10.
  "@vitest/browser-playwright": ^4.1.10
  "@vitest/coverage-v8": 4.1.10
  "@barney-media/crap-typescript": 0.5.1
  vitest: ^4.1.11
  # Exact, not a range: the 4.6.x line is still settling — 4.6.3 reverted
  # 4.6.0's standalone z.properties(), 4.6.4 landed a z.url() rewrite, and
  # 4.6.6/4.6.7 are days old. 4.6.5 itself has aged past the cooldown, so it
  # needs no `minimumReleaseAgeExclude` entry; widen to a caret once the line
  # stops moving.
  zod: 4.6.5

# Successor to onlyBuiltDependencies (v10.26+; the only mechanism in pnpm 11).
# Packages not listed are blocked from running install scripts. Every entry
# below is a reviewed decision; false entries match the pre-migration blocks.
allowBuilds:
  esbuild: true
  # testcontainers → dockerode. Native compiles are optional; the JS
  # fallback is enough for the local Docker socket integration tests use.
  cpu-features: false
  protobufjs: false
  ssh2: false
  "@nestjs/core": false # postinstall is scarf telemetry only
  "@scarf/scarf": false # telemetry
  # Downloads the sentry-cli binary; only needed when a build uploads
  # sourcemaps (SENTRY_AUTH_TOKEN set) — flip to true in the deploy pipeline.
  "@sentry/cli": false
  "@swc/core": false # native bindings ship via platform optionalDependencies
  core-js-pure: false # funding banner
  lefthook: false # binary ships via platform optionalDependencies; prepare script syncs hooks
  sharp: false # native bindings ship via platform optionalDependencies

# Evaluated for the multi-worktree agent workflow (https://pnpm.io/git-worktrees):
# symlink-only node_modules would make per-worktree installs near-instant.
# Deliberately OFF: with it enabled, tsgo resolves packages through global-store
# realpaths outside the project and @types identities split — apps/web typecheck
# fails (children missing on ThemeProviderProps, NextError not a JSX component)
# on the identical dependency versions. Revisit when tsgo/TS handle the layout.
virtualStoreType: project

patchedDependencies:
  "@orval/fetch@8.24.0": patches/@orval__fetch@8.24.0.patch
  # Backport of vitest-dev/vitest#11531 (not yet released): a tested file whose
  # path holds glob characters, like Next's `(chat)` route groups, was re-added
  # as an all-zero "uncovered" placeholder, doubling its statements in the
  # merged web coverage report. Drop this when vitest ships the fix.
  "vitest@4.1.11": patches/vitest@4.1.11.patch

# Advisories whose only route to a patched version runs through a parent that
# pins below the fix. Each key is the vulnerable version range and each value
# the patched version to force; the parent that makes the entry necessary is
# named beside it. Advisories whose parents already admit the patched version
# in their declared ranges get no entry — the lockfile carries the fix on its
# own once it is re-resolved. `pnpm audit --fix` regenerates this shape; drop an
# entry once its parent moves past the advisory.
overrides:
  # @barney-media/crap-typescript-core pins ~2.1.0.
  "@toon-format/toon@<2.3.1": 2.3.1
  # @vitest/browser and @vitest/browser-playwright pin 4.1.10 exactly.
  "@vitest/mocker@>=2.1.0 <4.1.11": 4.1.11
  # @esbuild-kit/core-utils, a deprecated dependency of drizzle-kit, pins
  # ~0.18.20. Its own subtree only ever runs the bundler for drizzle-kit.
  "esbuild@<=0.24.2": 0.25.0
  # @xhmikosr/{archive-type,downloader,decompress-*} pin ^20.5.0.
  "file-type@>=13.0.0 <=21.3.1": 21.3.4
  # orval pins 4.3.1.
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  # @nestjs/swagger pins 5.2.1 and markdownlint-cli2 pins 5.2.2.
  "js-yaml@>=5.0.0 <=5.4.0": 5.4.1
  # @streamdown/math, rehype-katex, mermaid, and micromark-extension-math all
  # pin ^0.16. rehype-katex only calls katex.renderToString, which 0.18 keeps.
  "katex@>=0.11.0 <0.18.2": 0.18.2
  # markdownlint-cli2 pins 14.3.0.
  "markdown-it@<14.3.1": 14.3.1
  # @nestjs/platform-express pins 2.2.0.
  "multer@>=2.2.0 <2.4.0": 2.4.0
  # @tailwindcss/typography pins 6.0.10; the advisory has no 6.x fix.
  "postcss-selector-parser@<7.1.6": 7.1.6
  # typed-rest-client pins 6.15.1.
  "qs@>=2.2.5 <6.16.0": 6.16.0
  # markdownlint-cli2 pins 1.7.0.
  "smol-toml@<=1.8.0": 1.9.0
  # @storybook/addon-mcp and @storybook/mcp pin 1.2.0.
  "valibot@<=1.4.1": 1.4.2
