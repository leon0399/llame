# Installed by the root `prepare` script. Hooks never mutate files.

rc: '"$(git rev-parse --show-toplevel)/.lefthookrc"'

pre-commit:
  parallel: true
  jobs:
    - name: code lint
      glob: "{**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs},**/.oxlintrc.json,.oxlintrc.json,**/package.json,package.json,**/tsconfig*.json,tsconfig*.json,packages/config-typescript/*.json,packages/oxlint-plugin-anti-slop/**/*.json,turbo.json}"
      run: pnpm lint:code

    - name: OpenAPI lint
      glob: "{apps/api/openapi.json,apps/api/redocly.yaml}"
      run: pnpm lint:openapi

    - name: dead-code lint
      glob: "{knip.json,package.json,apps/*/package.json,packages/*/package.json}"
      run: pnpm lint:dead-code

    - name: duplication lint
      glob: ".jscpd.json"
      run: pnpm lint:duplicates

    - name: complexity lint
      glob: "{scripts/quality-metrics.mjs,scripts/quality-metrics.test.mjs}"
      run: pnpm lint:complexity && pnpm test:metrics

    - name: lint plugin
      glob: "packages/oxlint-plugin-anti-slop/**/*.{ts,mjs,json}"
      run: pnpm --filter @workspace/oxlint-plugin-anti-slop typecheck && pnpm --filter @workspace/oxlint-plugin-anti-slop test

    - name: mutation tooling
      glob: "scripts/mutation-*.mjs"
      run: pnpm test:mutation:tooling

    - name: markdown lint
      glob: "{**/*.md,.markdownlint-cli2.jsonc}"
      run: pnpm lint:markdown

    - name: format
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,md,mdx,json,jsonc,css,scss,yaml,yml,html}"
      files: git diff --name-only --cached --diff-filter=ACMR
      run: pnpm exec prettier --check --cache --cache-strategy content --no-error-on-unmatched-pattern {files}

pre-push:
  parallel: true
  jobs:
    - name: format
      run: pnpm format:check

    - name: lint
      run: pnpm lint

    - name: typecheck
      run: pnpm typecheck
