# Installed by the root `prepare` script. Hooks never mutate files.

pre-commit:
  parallel: true
  jobs:
    - name: api lint
      glob: "{apps/api/**/*.ts,apps/api/.oxlintrc.json}"
      run: pnpm --filter api lint

    - name: web lint
      glob: "{apps/web/**/*.{ts,tsx,js,mjs},apps/web/.oxlintrc.json}"
      run: pnpm --filter web lint

    - name: ui lint
      glob: "{packages/ui/**/*.{ts,tsx,js,mjs,cjs},packages/ui/.oxlintrc.json}"
      run: pnpm --filter @workspace/ui lint

    - name: storybook lint
      glob: "{apps/storybook/**/*.{ts,tsx,js,mjs,cjs},apps/storybook/.oxlintrc.json}"
      run: pnpm --filter storybook lint

    - name: config interpolation lint
      glob: "{packages/config-interpolation/**/*.{ts,js,mjs},packages/config-interpolation/.oxlintrc.json}"
      run: pnpm --filter @workspace/config-interpolation lint

    - name: code lint
      glob: "{e2e/**/*.{ts,tsx,js,mjs},playwright.config.ts,.oxlintrc.json,turbo.json,package.json}"
      run: pnpm lint:code

    - name: OpenAPI lint
      glob: "{apps/api/openapi.json,apps/api/redocly.yaml}"
      run: pnpm lint:openapi

    - name: dead-code lint
      glob: "{knip.json,package.json,apps/*/package.json,packages/*/package.json}"
      run: pnpm lint:dead-code

    - name: duplication lint
      glob: ".jscpd.json"
      run: pnpm lint:duplicates

    - name: complexity lint
      glob: "{scripts/quality-metrics.mjs,scripts/quality-metrics.test.mjs}"
      run: pnpm lint:complexity && pnpm test:metrics

    - name: lint plugin
      glob: "packages/oxlint-plugin-anti-slop/**/*.{ts,mjs,json}"
      run: pnpm --filter @workspace/oxlint-plugin-anti-slop lint && pnpm --filter @workspace/oxlint-plugin-anti-slop typecheck && pnpm --filter @workspace/oxlint-plugin-anti-slop test

    - name: markdown lint
      glob: "{**/*.md,.markdownlint-cli2.jsonc}"
      run: pnpm lint:markdown

    - name: format
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,md,mdx,json,jsonc,css,scss,yaml,yml,html}"
      files: git diff --name-only --cached --diff-filter=ACMR
      run: pnpm exec prettier --check --no-error-on-unmatched-pattern {files}

pre-push:
  parallel: false
  jobs:
    - name: format
      run: pnpm format:check

    - name: lint
      run: pnpm lint

    - name: typecheck
      run: pnpm typecheck

    - name: test
      run: pnpm test
