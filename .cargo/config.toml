# Static musl binaries link with the toolchain's own lld and musl CRT, so no
# cross C toolchain is needed for either shipped architecture.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
