# Static musl binaries link with the toolchain's own lld and musl CRT.
# C dependencies still need a target compiler selected through CC_<target>.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
