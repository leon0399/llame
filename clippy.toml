# Thresholds for the Rust Machine daemon. Tests may use unwrap/expect.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
# Keep side effects visible in loops.
disallowed-methods = [
    { path = "std::iter::Iterator::for_each", reason = "Use a for loop for side effects" },
    { path = "std::iter::Iterator::try_for_each", reason = "Use a for loop for side effects and early returns" },
]
too-many-lines-threshold = 80
too-many-arguments-threshold = 5
