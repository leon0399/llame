[workspace]
resolver = "3"
members = ["apps/machine", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.98"

[workspace.dependencies]
machine-core = { path = "crates/machine-core" }
machine-protocol = { path = "crates/machine-protocol" }
machine-files = { path = "crates/machine-files" }
machine-grep = { path = "crates/machine-grep" }
machine-git = { path = "crates/machine-git" }
machine-jobs = { path = "crates/machine-jobs" }
machine-mcp = { path = "crates/machine-mcp" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = "0.7"
futures = "0.3"
tonic = "0.14"
tonic-prost = "0.14"
tonic-types = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"
protox = "0.10"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
] }
rustix = { version = "1", features = ["process", "fs", "system"] }
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
regex = "1"
tempfile = "3"
ignore = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
exit = "deny"
mem_forget = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_enum_match_arm = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
cast_possible_truncation = "allow"

[profile.release]
strip = true
lto = "thin"
