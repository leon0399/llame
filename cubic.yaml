# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
#
# Read from the DEFAULT BRANCH only — a copy on a feature branch is ignored.
# Precedence: this file > org `cubic-config` repo > dashboard > defaults.
#
# Only the first 5 custom_rules take effect. Each rule is truncated SILENTLY at
# 10,000 characters across its description, its linked file_paths, and
# custom_instructions — which is prepended to every rule and therefore charged
# against each one separately. Keep every linked file under that cap together
# with the instructions; docs/development/testing.md is over it, so tests are
# reviewed through the AGENTS.md files that point to it.
version: 1

reviews:
  enabled: true
  # Submit a real GitHub approval on a clean, low-risk review. `master` is
  # unprotected, so this is a signal rather than a merge gate.
  auto_approve_behavior: live
  auto_approve: low_risk_only
  auto_approve_rules:
    # Never auto-approve a change that can weaken isolation or CI, however clean
    # the review looked. Never-rules take precedence over everything below.
    exclude:
      - "apps/api/src/db/**"
      - "apps/api/src/auth/**"
      - "apps/api/src/identity/**"
      - ".github/workflows/**"
      - "cubic.yaml"
      - ".coderabbit.yaml"
    exclude_titles:
      - "WIP:*"
      - "wip:*"
    exclude_external_contributors: true
  # 3x the reviewed-line cost; trigger by hand on a risky stack.
  ultrareview: manual
  auto_ultrareview: disabled
  merge_confidence_summary: false
  architecture_diagrams: false
  resolve_threads_when_addressed: true

  ignore:
    files:
      - "pnpm-lock.yaml"
      - "**/dist/**"
      - "**/__fixtures__/**"
      - "**/__screenshots__/**"
      - "**/*.snap"
      - "CHANGELOG.md"
      # Generated artifacts — review the generator input, never the output.
      - "apps/api/openapi.json"
      - "apps/web/lib/api/generated/**"
      # Archived OpenSpec records are history, not proposals under review.
      - "openspec/changes/archive/**"

  # Prepended to every rule below and charged against each rule's cap, so it
  # stays short. The rules themselves live in the linked repository files.
  custom_instructions: |
    Review against the linked file, the AGENTS.md files from the repository root
    down to each changed file's directory, and the OpenSpec capability the change
    touches. Name the failure scenario or the documented rule violated.

  custom_rules:
    - name: Review guide
      description: Apply the review priorities and blocking checks in the linked file.
      file_paths:
        - REVIEW_GUIDE.md
    - name: Coding standards
      description: Apply the diff-shape rules in the linked file.
      file_paths:
        - CODING_STANDARDS.md

# cubic writes its summary into the GitHub PR body and has no option to post it as a
# separate comment, so off is the only control.
pr_descriptions:
  generate: false
  cubic_review_link: false

issues:
  fix_commits_to_pr: false
