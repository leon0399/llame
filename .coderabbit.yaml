# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  path_filters:
    - "!pnpm-lock.yaml"
    - "!**/dist/**"
    - "!**/__fixtures__/**"
    - "!**/__screenshots__/**"
    - "!**/*.snap"
    - "!CHANGELOG.md"
    # Generated artifacts — review the generator input, never the output.
    - "!apps/api/openapi.json"
    - "!apps/web/lib/api/generated/**"
    # Archived OpenSpec records are history, not proposals under review.
    - "!openspec/changes/archive/**"

  # Walkthrough poem adds no review value.
  poem: false
  # Request changes while CodeRabbit has unresolved comments, then approve once
  # they are resolved and pre-merge checks pass. Both halves come together.
  request_changes_workflow: true
  auto_apply_labels: true

knowledge_base:
  learnings:
    # Only apply learnings from this repository, not shared across other orgs/repos.
    scope: local
  # Every **/AGENTS.md and .claude/rules/*.md is a guideline by default, scoped
  # to its own directory or `paths`. These add the repository-wide review rules,
  # which live outside the tree they govern; nothing is restated here.
  code_guidelines:
    filePatterns:
      - files: "REVIEW_GUIDE.md"
        applyTo: "**"
      - files: "CODING_STANDARDS.md"
        applyTo: "**"
      - files: "docs/development/testing.md"
        applyTo: "**/*.test.{ts,tsx,mjs}, e2e/**"
