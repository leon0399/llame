# An upload is accepted by its bytes, not its declared type: anything other than
# a PNG, JPEG, GIF, or WebP image is a 415.
[[operations]]
include-operation-id = "uploadMedia"
checks.positive_data_acceptance.expected-statuses = [
  "2xx",
  "3xx",
  "401",
  "403",
  "404",
  "409",
  "415",
  "422",
  "429",
  "5xx",
]

# A locator naming a Machine this instance does not configure is refused with
# 503 `executor_unavailable` (openspec `repositories`); other 5xx still fail.
[[operations]]
include-operation-id = "registerCheckout"
checks.not_a_server_error.expected-statuses = ["2xx", "3xx", "4xx", "503"]
