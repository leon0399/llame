# Schemathesis configuration for the API DAST job (dast-schemathesis in
# .github/workflows/ci.yml). The schema path, base URL, seed and report options
# are passed on the command line.

# Every check, including the auth ones: ignored_auth (operations that answer
# without or with invalid credentials) and object_level_authorization (bob
# reading an object alice created).
checks.enabled = true
workers = 2
request-timeout = 10
max-time = 900
max-failures = 200

# Postgres text cannot hold U+0000, so the API refuses it in any request value
# with a documented 400; generating it would only test that refusal.
generation.allow-x00 = false

# Requests the schema cannot fully describe. The API answers 400 for a
# request that fails validation and 422 for a valid one the domain refuses (an
# unknown model, a path that is not a repository, a move into its own
# subtree), so 422 is an expected answer to schema-valid data. A body over the
# JSON parser's limit is refused with 413, which every operation with a body
# documents.
checks.positive_data_acceptance.expected-statuses = [
  "2xx",
  "3xx",
  "401",
  "403",
  "404",
  "409",
  "422",
  "429",
  "5xx",
]
checks.negative_data_rejection.expected-statuses = [
  "400",
  "401",
  "403",
  "404",
  "405",
  "406",
  "409",
  "413",
  "415",
  "422",
  "428",
  "429",
  "5xx",
]

[auth]
auto-signup = false

[auth.wfc]
path = "/secrets/auth.wfc.json"
user = "alice"
peers = ["alice", "bob"]

[phases.fuzzing]
generation.max-examples = 50

# Server-sent event streams never end on their own.
[[operations]]
include-operation-id = "resumeChatStream"
enabled = false

[[operations]]
include-operation-id = "streamRunEvents"
enabled = false

# Revoking or ending a session would sign the scanner out mid-run.
[[operations]]
include-operation-id = "revokeSessions"
enabled = false

[[operations]]
include-operation-id = "revokeSession"
enabled = false

[[operations]]
include-operation-id = "logoutUser"
enabled = false

# Constraints OpenAPI 3.0 cannot state, answered with 400: `beforeSeq` and
# `targetSeq` exclude each other, a Knowledge Space cursor must be one the
# server issued, and a message holds at most 50 text and 10 file parts (the
# schema can bound only the total), on the message route and on the create's
# first message.
[[operations]]
include-operation-id = "getChatMessages"
checks.positive_data_acceptance.expected-statuses = [
  "2xx",
  "3xx",
  "400",
  "401",
  "403",
  "404",
  "409",
  "422",
  "429",
  "5xx",
]

[[operations]]
include-operation-id = "listKnowledgeSpaces"
checks.positive_data_acceptance.expected-statuses = [
  "2xx",
  "3xx",
  "400",
  "401",
  "403",
  "404",
  "409",
  "422",
  "429",
  "5xx",
]

[[operations]]
include-operation-id = "createChatMessage"
checks.positive_data_acceptance.expected-statuses = [
  "2xx",
  "3xx",
  "400",
  "401",
  "403",
  "404",
  "409",
  "422",
  "429",
  "5xx",
]

[[operations]]
include-operation-id = "createChat"
checks.positive_data_acceptance.expected-statuses = [
